<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RuneScape Boss Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>RuneScape Boss Tracker</h1>
    <p>Keep track of RuneScape bosses and their locations!</p>
  </header>

  <section></section>
  <div class="add-box">
    <label for="title-input">Boss Name:</label>
    <input type="text" id="title-input" placeholder="Type a new boss..." required>

    <br>

    <label for="location-input">Boss Location:</label>
    <input type="text" id="location-input" placeholder="Enter boss location..." required>

    <br>

    <button onclick="addItem()">Add Boss</button>
  </div>
</section>

<section>
  <h2>Saved Bosses</h2>
  <ul id="item-list"></ul>
</section>




<footer>
  <p>2023 RuneScape Boss Tracker. All rights reserved. Final Project</p>
</footer>

  <script src="app.js"></script>
</body>
</html>
